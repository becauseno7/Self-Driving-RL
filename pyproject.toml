[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-driving-rl"
version = "1.0.0"
description = "A layered QR-DQN and preference-learning driver for a custom highway simulator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Shuvra Basak" },
]
keywords = ["reinforcement-learning", "simulation", "qrdqn", "rlaif", "gymnasium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium==1.3.0",
    "highway-env==1.12.0",
    "numpy==2.3.2",
    "pygame-ce==2.5.7",
    "sb3-contrib==2.9.0",
    "stable-baselines3==2.9.0",
    "tensorboard==2.20.0",
    "torch==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[project.scripts]
sdr-game = "self_driving_rl.game:main"
sdr-rlaif = "self_driving_rl.rlaif:main"
sdr-dagger = "self_driving_rl.dagger:main"
sdr-inspect = "self_driving_rl.inspect_environment:main"
sdr-random = "self_driving_rl.random_baseline:main"
sdr-train = "self_driving_rl.train:main"
sdr-evaluate = "self_driving_rl.evaluate:main"

[project.urls]
Homepage = "https://github.com/becauseno7/Self-Driving-RL"
Repository = "https://github.com/becauseno7/Self-Driving-RL"
Issues = "https://github.com/becauseno7/Self-Driving-RL/issues"
Documentation = "https://github.com/becauseno7/Self-Driving-RL/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/self_driving_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
